name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [foundation/**]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Check Worker syntax
        run: node --check worker/preview.js && node --check worker/auth.js
      - name: Production build
        run: npm run build
