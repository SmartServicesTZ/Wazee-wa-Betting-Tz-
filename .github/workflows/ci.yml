name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, foundation/**]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); for (const [name,v] of Object.entries(r.vulnerabilities||{})) console.log(name+' | '+v.severity+' | '+v.range+' | fix='+JSON.stringify(v.fixAvailable))"
      - name: Typecheck
        run: npm run typecheck
      - name: Check Worker syntax
        run: node --check worker/preview.js && node --check worker/auth.js
      - name: Production build
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wazee-pages-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
